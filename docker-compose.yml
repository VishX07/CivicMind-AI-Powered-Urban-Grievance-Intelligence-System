version: '3.9'

services:
  ai-service:
    build: ./backend/ai-service
    ports:
      - '8000:8000'

  backend:
    build: ./backend
    ports:
      - '5000:5000'
    env_file:
      - ./backend/.env
    depends_on:
      - ai-service

  frontend:
    build: ./frontend
    ports:
      - '5173:5173'
    depends_on:
      - backend
